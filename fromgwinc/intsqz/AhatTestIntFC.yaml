+inherit: 'AhatTest.yaml'

intSqueezer:

  FilterCavity:
    L: 300                  # cavity length [m] (same as LIGO FC)
    Ti: .38e-3              # input mirror transmission [power]
    Te: 1e-9                # end mirror transmission [power] (high reflector)
    Lrt: 1e-9              # round-trip loss
    fdetune: -32           # detuning [Hz]
    #fdetune: -20           # detuning [Hz]
    #fdetune: -250002           # detuning [Hz]

Optics:
  Quadrature:
    #dc: 1.5707963                 # pi/2 # demod/detection/homodyne phase
    #dc: 0.1                 # pi/2 # demod/detection/homodyne phase
