+inherit: 'Aplus.yaml'

Suspension:
    RPdynamics: FreeMass

Laser:
  # needed for nominal BS power
  Power: 80

Optics:
    MM_IFO_OMC: 0  # 0.02
    MM_IFO_OMCphi: 0
    MM_ARM_SRC: 0.000000005
    MM_INTSQZ: 0.00000001
    MM_SEC_ARMphi: -0.2
    MM_XARM_YARM: 1e-3
    MM_SRC_PRC: 0.01
    MM_SRC_PRCphi: 0.38
    is_OPD: False

    SRM:
      Transmittance: .999
    ITM:
      Transmittance: .05

intSqueezer:
  AmplitudedB: 14

  #ifo.Optics.MM_INTSQZ = 0.00
Squeezer:
    # Turn off external squeezing
    AmplitudedB: 0
    MM_SQZ_OMC: 0  # 0.1
    direct_mm_sqz_ifo: True

    Type: 'Freq Dependent'
    InjectionLoss: 0.05             # power loss to sqz
    SQZAngle: 0                     # SQZ phase [radians]
    LOAngleRMS: 30e-3               # quadrature noise [radians]

    # Good settings for low power 5% item
    FilterCavity:
      L_mm: 0  # 0.5
      Lrt: 60e-6                    # round-trip loss in the cavity
      Rot: 0                        # phase rotation after cavity
      fdetune: -00              # detuning [Hz]
      Ti: .63e-3                    # input mirror transmission [Power]
