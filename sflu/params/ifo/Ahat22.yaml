+inherit: 'Aplus.yaml'

Suspension:
    RPdynamics: FreeMass

Laser:
  # needed for nominal BS power
  Power: 80

Optics:
    MM_IFO_OMC: 0  # 0.02
    MM_IFO_OMCphi: 0
    MM_ARM_SRC: 0.0005
    MM_INTSQZ: 0.01
    MM_SEC_ARMphi: -0.2
    MM_XARM_YARM: 0.0 # 1e-3
    MM_SRC_PRC: 0  # 0.01
    MM_SRC_PRCphi: 0.38
    is_OPD: False

    SRM:
      Transmittance: .025
    ITM:
      Transmittance: .025

intSqueezer:
  AmplitudedB: 22

  #ifo.Optics.MM_INTSQZ = 0.00
Squeezer:
    MM_SQZ_OMC: 0  # 0.1
    direct_mm_sqz_ifo: True
    FilterCavity:
        L_mm: 0  # 0.5

    Type: 'Freq Dependent'
    AmplitudedB: 14                 # SQZ amplitude [dB]
    InjectionLoss: 0.05             # power loss to sqz
    SQZAngle: 0                     # SQZ phase [radians]
    LOAngleRMS: 30e-3               # quadrature noise [radians]

    # Good settings for low power 5% item
    FilterCavity:
      Lrt: 60e-6                    # round-trip loss in the cavity
      Rot: 0                        # phase rotation after cavity
      fdetune: -80              # detuning [Hz]
      Ti: 2.0e-3                    # input mirror transmission [Power]
