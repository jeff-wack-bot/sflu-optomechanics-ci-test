# CI for sflu-optomechanics.
#
# Three jobs:
#   guard  - numerical regression check; blocking. A structural change that
#            moves a number fails here.
#   tests  - the full example suite.
#   pages  - regenerates the documentation from the examples and publishes it.
#
# PYTHONHASHSEED is pinned globally. SFLU eliminates graph nodes in Python set
# iteration order, so an unpinned seed shifts budgets by ~1e-3 between runs and
# the regression baselines cannot match. See REFACTOR_PLAN.md, Finding 1.

stages:
  - verify
  - deploy

variables:
  PYTHONHASHSEED: "0"
  CONDA_ENV: wield
  GIT_SUBMODULE_STRATEGY: none

default:
  image: condaforge/miniforge3:latest
  before_script:
    # The wield dev dependencies are cloned over SSH by setup.sh. Provide a
    # deploy key as the SSH_PRIVATE_KEY CI variable (Settings -> CI/CD ->
    # Variables, type "File" or masked text). Without it setup.sh cannot reach
    # git.mccullerlab.com and every job fails at the clone step.
    - |
      if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
        command -v ssh-agent >/dev/null || (apt-get update -qq && apt-get install -y -qq openssh-client)
        eval "$(ssh-agent -s)"
        printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        ssh-keyscan -p 2224 git.mccullerlab.com >> ~/.ssh/known_hosts 2>/dev/null || true
      else
        echo "SSH_PRIVATE_KEY is not set; setup.sh will fail to clone the wield packages." >&2
      fi
    - ./setup.sh

# deps/ holds the cloned wield packages; caching them keeps pipelines short.
cache:
  key: "deps-$CI_COMMIT_REF_SLUG"
  paths:
    - deps/

guard:
  stage: verify
  script:
    - conda run -n "$CONDA_ENV" make guard PYTHON=python
  artifacts:
    when: on_failure
    paths:
      - tools/regression/baselines/
    expire_in: 1 week

tests:
  stage: verify
  # Allowed to fail only because of one known pre-existing failure,
  # models/test_simple_mirror.py::test_sflu_simple_mirror ('Struct' object has
  # no attribute 'Thr'). Flip this to false once that is fixed, so the suite
  # becomes blocking. The 14 errors from the absent optional qlance/Optickle
  # dependency are expected in CI and are not a repo fault.
  allow_failure: true
  script:
    - conda run -n "$CONDA_ENV" make test PYTHON=python
  artifacts:
    when: always
    paths:
      - "**/tresults/"
    expire_in: 1 week

pages:
  stage: deploy
  script:
    # --strict fails the build if a documented example goes missing, stops
    # producing figures, or a new example appears with no page.
    - conda run -n "$CONDA_ENV" python docs/generate_docs.py --strict
    - conda run -n "$CONDA_ENV" python -m mkdocs build -f docs/mkdocs.yml -d "$CI_PROJECT_DIR/public"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
